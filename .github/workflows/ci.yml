name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins rustc 1.96.1 and the wasm32v1-none target.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The CLI version is embedded in the Wasm metadata (`cliver`), so it is
      # part of the reproducible build and must match the pinned hash.
      - name: Install stellar-cli 27.0.0
        uses: stellar/stellar-cli@v27.0.0

      - name: Unit tests
        run: cargo test --locked

      - name: Build Wasm
        run: stellar contract build --locked

      - name: Check reproducible Wasm hash
        run: |
          expected=$(cat contracts/verifier/WASM_HASH)
          actual=$(stellar contract info hash --wasm target/wasm32v1-none/release/sep53c_verifier.wasm)
          echo "expected: $expected"
          echo "actual:   $actual"
          test "$expected" = "$actual"

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests (offline)
        run: |
          pnpm --filter c-sign typecheck
          pnpm --filter c-sign test

      # Chrome is preinstalled on ubuntu-latest; the bundle has no Buffer polyfill.
      - name: Browser smoke test
        run: pnpm --filter c-sign test:browser

      - name: Typecheck the examples
        run: |
          pnpm --filter c-sign build
          pnpm --filter "./examples/*" typecheck

      # An application on stellar-sdk 16 with passkey-kit 0.14 and 0.20, as wallets are built today.
      - name: Wallet-kit compatibility (stellar-sdk 16)
        run: |
          pnpm --filter c-sign-kit-compat typecheck
          pnpm --filter c-sign-kit-compat test
